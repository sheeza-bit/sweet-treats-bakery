<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Treats</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 text-gray-800 font-sans">

<!-- NAVBAR -->
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
  <h2 class="text-2xl font-bold text-orange-600">🍰 Sweet Treats</h2>
  <ul class="flex space-x-6 font-medium text-gray-600">
    <li><a href="index.html" class="hover:text-orange-600 transition">Home</a></li>
    <li><a href="about.html" class="hover:text-orange-600 transition">About</a></li>
    <li><a href="services.html" class="hover:text-orange-600 transition">Services</a></li>
    <li><a href="contact.html" class="hover:text-orange-600 transition">Contact</a></li>
  </ul>
</nav>

<!-- MAIN CONTENT WRAPPER -->
<div class="max-w-6xl mx-auto px-6 py-12">

  <!-- HERO -->
  <div class="bg-orange-100 rounded-3xl p-16 text-center mb-12 shadow-sm border border-orange-200">
    <p class="text-2xl md:text-3xl font-medium text-orange-700 italic italic">Fresh cakes for every occasion</p>
  </div>

  <h1 class="text-4xl md:text-5xl font-black text-center mb-4 text-gray-900 uppercase">Welcome to Sweet Treats</h1>
  <p class="text-center text-xl text-gray-600 mb-16 italic">We bake happiness for every occasion 🎂</p>

  <h2 class="text-3xl font-bold text-center mb-8 uppercase tracking-widest">Gallery</h2>

  <!-- GALLERY -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <div class="rounded-2xl overflow-hidden shadow-lg h-80 bg-white">
        <img src="cake1.jpg" class="w-full h-full object-cover hover:scale-110 transition duration-500" alt="Cake 1">
    </div>
    <div class="rounded-2xl overflow-hidden shadow-lg h-80 bg-white">
        <img src="cake2.jpg" class="w-full h-full object-cover hover:scale-110 transition duration-500" alt="Cake 2">
    </div>
    <div class="rounded-2xl overflow-hidden shadow-lg h-80 bg-white">
        <img src="cake3.jpg" class="w-full h-full object-cover hover:scale-110 transition duration-500" alt="Cake 3">
    </div>
    <div class="rounded-2xl overflow-hidden shadow-lg h-80 bg-white">
        <img src="cake4.jpg" class="w-full h-full object-cover hover:scale-110 transition duration-500" alt="Cake 4">
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer class="bg-gray-900 text-white py-8 text-center mt-12">
  <p class="opacity-80">© 2026 Sweet Treats Bakery</p>
</footer>
