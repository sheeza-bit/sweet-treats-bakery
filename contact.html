<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Sweet Treats Bakery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-orange-50">

<!-- Navbar -->
<nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center sticky top-0 z-50">
  <div class="text-2xl font-bold text-orange-600">🍰 Sweet Treats</div>
  <ul class="hidden md:flex space-x-8 font-medium text-gray-600">
    <li><a href="index.html" class="hover:text-orange-600 transition">Home</a></li>
    <li><a href="about.html" class="hover:text-orange-600 transition">About</a></li>
    <li><a href="services.html" class="hover:text-orange-600 transition">Services</a></li>
    <li><a href="contact.html" class="text-orange-600 font-bold underline decoration-2 underline-offset-4">Contact</a></li>
  </ul>
</nav>

<!-- Main Container -->
<div class="max-w-4xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center gap-12">
  
  <!-- Left Side: Text/Info -->
  <div class="md:w-1/2 text-center md:text-left">
    <h1 class="text-5xl font-black text-orange-900 mb-6 uppercase leading-tight italic">Get in <br><span class="text-orange-600 underline decoration-orange-200">Touch</span></h1>
    <p class="text-lg text-orange-800 mb-8 font-light italic">Have a custom cake request or a question? Send us a message and we'll get back to you with sweetness! 🎂</p>
    <div class="space-y-4">
        <p class="font-bold text-orange-900">📍 123 Bakery Street, Sweet Town</p>
        <p class="font-bold text-orange-900">📞 +1 234 567 890</p>
    </div>
  </div>

  <!-- Right Side: Colorful Form -->
  <div class="md:w-1/2 w-full">
    <div class="bg-orange-600 p-1 rounded-[3rem] shadow-2xl"> <!-- Outer color border -->
      <section class="bg-white p-10 rounded-[2.8rem]">
        <form id="contactForm" class="space-y-5">
          <div>
            <label class="block text-sm font-bold text-orange-900 mb-2 px-2">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" 
                   class="w-full p-4 bg-orange-50 rounded-2xl outline-none border-2 border-orange-100 focus:border-orange-500 transition-all text-orange-900 placeholder-orange-300">
          </div>

          <div>
            <label class="block text-sm font-bold text-orange-900 mb-2 px-2">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" 
                   class="w-full p-4 bg-orange-50 rounded-2xl outline-none border-2 border-orange-100 focus:border-orange-500 transition-all text-orange-900 placeholder-orange-300">
          </div>

          <div>
            <label class="block text-sm font-bold text-orange-900 mb-2 px-2">Message</label>
            <textarea id="message" placeholder="What's on your mind?" rows="4" 
                      class="w-full p-4 bg-orange-50 rounded-2xl outline-none border-2 border-orange-100 focus:border-orange-500 transition-all text-orange-900 placeholder-orange-300 resize-none"></textarea>
          </div>

          <button type="submit" 
                  class="w-full bg-orange-600 text-white py-4 rounded-2xl font-black text-xl hover:bg-orange-900 transition-all shadow-lg shadow-orange-200 uppercase tracking-widest transform hover:scale-[1.02]">
            Send Message 🚀
          </button>
        </form>
      </section>
    </div>
  </div>

</div>

<!-- Footer -->
<footer class="bg-orange-950 text-orange-100 py-8 text-center mt-auto">
  <p class="opacity-70 text-sm tracking-widest uppercase italic font-medium">© 2026 Sweet Treats Bakery</p>
</footer>

</body>
</html>
